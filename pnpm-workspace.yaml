packages:
  - 'app/*'
  - 'packages/*'

dedupePeers: true

allowBuilds:
  esbuild: true
  # electron's install.js places the Electron binary in node_modules; skipping it breaks desktop:dev / desktop:start
  electron: true
  # Skip the build script of the Squirrel packaging helper (unused by the NSIS/portable targets)
  electron-winstaller: false

overrides:
  'vue': 'beta'
  '@vue/compiler-core': 'beta'
  '@vue/compiler-dom': 'beta'
  '@vue/compiler-sfc': 'beta'
  '@vue/compiler-ssr': 'beta'
  '@vue/compiler-vapor': 'beta'
  '@vue/reactivity': 'beta'
  '@vue/runtime-core': 'beta'
  '@vue/runtime-dom': 'beta'
  '@vue/runtime-vapor': 'beta'
  '@vue/server-renderer': 'beta'
  '@vue/shared': 'beta'
  '@vue/compat': 'beta'

peerDependencyRules:
  allowAny:
    - 'vue'
