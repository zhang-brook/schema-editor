name: Deploy & Release

on:
  push:
    tags: ['v*']
    # branches: [main]
  # workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The artifact names and the CHANGELOG section are looked up by tag, so a
      # tag that disagrees with the root package.json version would publish
      # mislabeled installers with an empty release body.
      - name: Check the tag against the app version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ "${TAG#v}" = "$TAG" ]; then
            echo "Not a v* tag (${TAG}); skipping version verification."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag ${TAG} is not version ${version}; bump the root package.json and re-tag." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Verified ${TAG} against the root package.json version ${version}."

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm build

      # Pages serves the stable web app. A prerelease tag still builds this
      # artifact for the offline bundle below, but must not replace the live site.
      - name: Setup Pages
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/web/dist

      # uploaded separately from the Pages artifact (a tar wrapper) so the release
      # job can zip the plain web build on every tag, prereleases included
      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: app/web/dist

  deploy:
    if: ${{ !contains(github.ref_name, '-') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  desktop:
    name: desktop (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: desktop-windows
            args: --win --x64
          # The universal build covers both Intel and Apple Silicon, with a single latest-mac.yml
          - runner: macos-latest
            artifact: desktop-macos
            args: --mac --universal
          - runner: ubuntu-latest
            artifact: desktop-linux
            args: --linux --x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build desktop app
        run: pnpm desktop:build

      - name: Package installers
        run: pnpm -C app/desktop exec electron-builder --config electron-builder.mjs --publish never ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/desktop/release/*.exe
            app/desktop/release/*.dmg
            app/desktop/release/*.zip
            app/desktop/release/*.AppImage
            app/desktop/release/*.deb
            app/desktop/release/*.blockmap
            app/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build, deploy, desktop]
    # deploy is skipped for prerelease tags, which still publish their assets
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.desktop.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download web bundle
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web-dist

      # Upload in the same batch as the web bundle so concurrent jobs don't race on the same tag assets
      - name: Download desktop installers
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Package release assets
        run: |
          mkdir -p release
          name="schema-editor-${GITHUB_REF_NAME}"
          (cd web-dist && zip -qr "../release/${name}.zip" .)
          # Use %P to strip the "./" prefix so extraction doesn't create an extra "." directory
          (cd web-dist && find . -mindepth 1 -maxdepth 1 -printf '%P\0' | tar --null -czf "../release/${name}.tar.gz" -T -)

      - name: Extract changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ ("^## " ver "[ \t\r]*$") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "No changelog entry found in CHANGELOG.md for ${GITHUB_REF_NAME}." > release-body.md
          fi

      - name: Append download links
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mirror="https://v6.gh-proxy.org/${base}"
          asset() { find release -maxdepth 1 -type f -name "$1" -printf '%f\n' -quit; }
          link() { printf '[%s](%s/%s) ([国内镜像](%s/%s))' "$1" "$base" "$2" "$mirror" "$2"; }

          win_setup=$(asset '*-windows-*-setup.exe')
          win_portable=$(asset '*-windows-*-portable.exe')
          mac_dmg=$(asset '*-macos-*.dmg')
          linux_appimage=$(asset '*-linux-*.AppImage')
          linux_deb=$(asset '*-linux-*.deb')

          {
            echo ''
            echo '### 📥 Downloads'
            echo ''
            printf -- '- **Windows (x64)**: '
            link 'Installer' "$win_setup"
            printf ' · '
            link 'Portable' "$win_portable"
            printf '\n- **macOS (Universal)**: '
            link 'DMG' "$mac_dmg"
            printf '\n- **Linux (x64)**: '
            link 'AppImage' "$linux_appimage"
            printf ' · '
            link 'DEB' "$linux_deb"
            printf '\n- **Web**: '
            # a prerelease does not deploy Pages, so the live preview still shows the latest stable build
            if [ "${GITHUB_REF_NAME#*-}" = "$GITHUB_REF_NAME" ]; then
              printf '[Live Preview](https://%s.github.io/%s/) · ' "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_REPOSITORY#*/}"
            fi
            link 'Offline bundle' "schema-editor-${GITHUB_REF_NAME}.zip"
            printf '\n'
          } >> release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: release/*
          # Release convention shared by the abrooka apps: a tag with a hyphen
          # after the version (v1.2.3-beta.1) publishes as a GitHub pre-release;
          # a plain v1.2.3 tag publishes as the current stable release.
          # Pre-releases are skipped by releases/latest, so they do not reach the
          # in-app updater.
          prerelease: ${{ contains(github.ref_name, '-') }}
