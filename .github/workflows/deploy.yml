name: Deploy & Release

on:
  push:
    tags: ['v*']
    # branches: [main]
  # workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: pages-artifact

      - name: Package release assets
        run: |
          mkdir -p dist release
          tar -xf pages-artifact/artifact.tar -C dist
          name="schema-editor-${GITHUB_REF_NAME}"
          (cd dist && zip -qr "../release/${name}.zip" .)
          # 用 %P 去掉 "./" 前缀，避免解压时多出一层 "." 目录
          (cd dist && find . -mindepth 1 -maxdepth 1 -printf '%P\0' | tar --null -czf "../release/${name}.tar.gz" -T -)

      - name: Extract changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ ("^## " ver "[ \t\r]*$") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "未在 CHANGELOG.md 中找到 ${GITHUB_REF_NAME} 对应的更新说明。" > release-body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: release/*
