name: Deploy & Release

on:
  push:
    tags: ['v*']
    # branches: [main]
  # workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  desktop:
    name: desktop (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: desktop-windows
            args: --win --x64
          # 通用包同时覆盖 Intel 与 Apple Silicon，且只有一个 latest-mac.yml
          - runner: macos-latest
            artifact: desktop-macos
            args: --mac --universal
          - runner: ubuntu-latest
            artifact: desktop-linux
            args: --linux --x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build desktop app
        run: pnpm desktop:build

      - name: Package installers
        run: pnpm -C app/desktop exec electron-builder --config electron-builder.mjs --publish never ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/desktop/release/*.exe
            app/desktop/release/*.dmg
            app/desktop/release/*.zip
            app/desktop/release/*.AppImage
            app/desktop/release/*.deb
            app/desktop/release/*.blockmap
            app/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build, deploy, desktop]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Pages artifact
        uses: actions/download-artifact@v7
        with:
          name: github-pages
          path: pages-artifact

      # 与 Web 包同批挂进 Release，避免多个 job 争着改同一个 tag 的资产
      - name: Download desktop installers
        uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true

      - name: Package release assets
        run: |
          mkdir -p dist release
          tar -xf pages-artifact/artifact.tar -C dist
          name="schema-editor-${GITHUB_REF_NAME}"
          (cd dist && zip -qr "../release/${name}.zip" .)
          # 用 %P 去掉 "./" 前缀，避免解压时多出一层 "." 目录
          (cd dist && find . -mindepth 1 -maxdepth 1 -printf '%P\0' | tar --null -czf "../release/${name}.tar.gz" -T -)

      - name: Extract changelog section
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            $0 ~ ("^## " ver "[ \t\r]*$") { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "未在 CHANGELOG.md 中找到 ${GITHUB_REF_NAME} 对应的更新说明。" > release-body.md
          fi

      - name: Append download links
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          asset() { find release -maxdepth 1 -type f -name "$1" -printf '%f\n' -quit; }

          win_setup=$(asset '*-windows-*-setup.exe')
          win_portable=$(asset '*-windows-*-portable.exe')
          mac_dmg=$(asset '*-macos-*.dmg')
          linux_appimage=$(asset '*-linux-*.AppImage')
          linux_deb=$(asset '*-linux-*.deb')

          {
            echo ''
            echo '### 📥 下载'
            echo ''
            echo "- **Windows (x64)**：[安装包](${base}/${win_setup}) · [便携版](${base}/${win_portable})"
            echo "- **macOS (Universal)**：[DMG](${base}/${mac_dmg})"
            echo "- **Linux (x64)**：[AppImage](${base}/${linux_appimage}) · [DEB](${base}/${linux_deb})"
            echo "- **Web**：[在线使用](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/) · [离线包](${base}/schema-editor-${GITHUB_REF_NAME}.zip)"
          } >> release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: release/*
