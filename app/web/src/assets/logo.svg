<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Schema Editor">
  <defs>
    <linearGradient id="bg" x1="20" y1="20" x2="492" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A5C97"/>
      <stop offset="0.55" stop-color="#14365F"/>
      <stop offset="1" stop-color="#091A2E"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bg)"/>
  <rect x="21" y="21" width="470" height="470" rx="119" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <!-- S: schema structure; the blue band is the active row, the mint bar the editing caret -->
  <path d="M318 152H148V256" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M148 256H318" fill="none" stroke="#5B9BF5" stroke-width="64" stroke-linecap="round"/>
  <path d="M318 256V360H148" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- one column seam across the unselected rows; the highlighted row stays continuous -->
  <g fill="url(#bg)">
    <rect x="260" y="100" width="6" height="118"/>
    <rect x="260" y="294" width="6" height="118"/>
  </g>

  <rect x="370" y="212" width="28" height="88" rx="14" fill="#3DDC97"/>
</svg>
