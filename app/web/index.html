<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" sizes="any" href="./src/assets/logo.svg">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema Editor</title>
    <script>
      // Apply theme and density before first paint to avoid a white flash in dark mode and layout shift (storage keys match those defined in composables)
      try {
        const pref = localStorage.getItem('schema-editor.theme')
        const dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')

        const density = localStorage.getItem('schema-editor.density')
        document.documentElement.dataset.density = density === 'compact' || density === 'relaxed' ? density : 'normal'
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
